name: Actualizar Hashes de Canales

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas (puedes ajustar el horario)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronizar JSON
        run: python sync.py

      - name: Guardar cambios si hay diferencias
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hashes.json
          git status
          git diff-index --quiet HEAD || (git commit -m "Auto-update hashes.json [skip ci]" && git push)
